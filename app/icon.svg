<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1124"/>
      <stop offset="50%" stop-color="#080a17"/>
      <stop offset="100%" stop-color="#05060e"/>
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Center Ambient Glow -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- T Letter Gradient (Crisp White to Soft Cool Silver) -->
    <linearGradient id="t-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- I Letter Gradient (Electric Indigo / Violet Accent) -->
    <linearGradient id="i-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="letter-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="14" y="14" width="484" height="484" rx="115" fill="url(#bg-grad)"/>
  
  <!-- Subtle Center Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#center-glow)"/>

  <!-- Border -->
  <rect x="14" y="14" width="484" height="484" rx="115" fill="none" stroke="url(#border-grad)" stroke-width="9"/>

  <!-- Monogram Letters "TI" with Drop Shadow -->
  <g filter="url(#letter-shadow)">
    <!-- Letter T (Top bar + stem) -->
    <rect x="121" y="144" width="176" height="52" rx="10.5" fill="url(#t-fill)"/>
    <rect x="182" y="144" width="54" height="224" rx="10.5" fill="url(#t-fill)"/>

    <!-- Letter I (Accent Indigo pillar) -->
    <rect x="337" y="144" width="54" height="224" rx="10.5" fill="url(#i-fill)"/>
  </g>
</svg>
